<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Sentinel style transfer visual">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071019"/>
      <stop offset="1" stop-color="#1a2033"/>
    </linearGradient>
    <linearGradient id="sat" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#587868"/>
      <stop offset="1" stop-color="#273d63"/>
    </linearGradient>
    <linearGradient id="sar" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#b7b7b7"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#ffb86b"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="76" y="92" fill="#f9fff9" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">Sentinel Style Transfer</text>
  <text x="80" y="142" fill="#a8bdbc" font-family="Inter, Arial, sans-serif" font-size="22">pix2pix GAN translation from Sentinel-2 to Sentinel-1 style inputs</text>
  <g transform="translate(118 228)">
    <rect width="350" height="300" rx="20" fill="url(#sat)" stroke="#19e6ff" stroke-opacity=".35"/>
    <path d="M0 232c64-24 124-38 190-16s102 2 160-28v112H0z" fill="#242a1d" opacity=".76"/>
    <path d="M0 82c68 16 118 8 178-20s96 10 172 18v120c-84 0-106-56-176-22s-104 28-174 14z" fill="#395f45" opacity=".85"/>
    <text x="175" y="346" text-anchor="middle" fill="#d7fff7" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Sentinel-2</text>
  </g>
  <path d="M520 378H682" stroke="#ffb86b" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="600" y="338" text-anchor="middle" fill="#ffdfbd" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">pix2pix GAN</text>
  <g transform="translate(730 228)">
    <rect width="350" height="300" rx="20" fill="url(#sar)" stroke="#7cff9d" stroke-opacity=".35"/>
    <path d="M0 190c64-36 92-18 142-46 76-42 116 8 208-12v168H0z" fill="#090909" opacity=".62"/>
    <path d="M0 60c80 38 134-34 212 10 48 28 86-6 138-2v140c-74 0-104-60-176-22s-96 4-174 12z" fill="#e8e8e8" opacity=".28"/>
    <text x="175" y="346" text-anchor="middle" fill="#d7fff7" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Sentinel-1 style</text>
  </g>
  <text x="80" y="628" fill="#9fb9b8" font-family="Inter, Arial, sans-serif" font-size="20">Goal: reduce dependence on matched sensor data during inference experiments.</text>
</svg>
